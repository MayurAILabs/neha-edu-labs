<!--
  This page is a template for viewing a single course, e.g. course-detail.html?id=ai-foundations.
  All content below is rendered client-side by NELCourses.renderDetail(), which also overwrites
  document.title and the <meta name="description"> tag once the matching course loads from
  data/courses.json. That's expected for this client-only, no-build-step architecture — search
  engines that execute JS will see the per-course title/description; the static values below are
  just a sane generic fallback for the first paint / non-JS crawlers.
-->
<title>Course Details | Neha Edu Labs</title>
